# Review before applying: this provisions a PAID service and disk.
# No service is created by committing this file. Apply manually only after approval.
services:
  - type: web
    name: muggo-admin
    runtime: node
    repo: https://github.com/mfgkoreaceo-ops/muggo-corporate-site
    branch: main
    plan: starter
    numInstances: 1
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: muggo-admin-state
      mountPath: /var/data/muggo
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: GITHUB_AUTH_MODE
        value: github-app
      - key: CMS_STATE_DIRECTORY
        value: /var/data/muggo
      - key: CMS_BRANCH
        value: main
      - key: CMS_PUBLISH_ENABLED
        value: "false"
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_INSTALLATION_ID
        sync: false
      - key: CMS_GITHUB_USER_ROLES
        sync: false
