<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Corporate &amp; Recruitment Verification</title>
  <meta name="description" content="Identitas resmi perusahaan, informasi pra-pembukaan (pre-opening), dan verifikasi rekrutmen resmi di Jakarta Selatan." />
  <meta name="theme-color" content="#4CDBBE" />

  <!-- Open Graph Preview (populated dynamically from site.config.js) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mfgkoreaceo-ops.github.io/muggo-corporate-site/" />
  <meta property="og:site_name" content="Official Corporate &amp; Recruitment Site" />
  <meta property="og:title" content="Informasi Korporat &amp; Rekrutmen Resmi" />
  <meta property="og:description" content="Identitas resmi perusahaan, informasi pra-pembukaan (pre-opening), dan verifikasi rekrutmen resmi di Jakarta." />
  <meta property="og:image" content="https://mfgkoreaceo-ops.github.io/muggo-corporate-site/assets/muggo-brand-hero.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="assets/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

  <!-- Theme initialization before paint (matching mokgo-hr-staging.vercel.app) -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("muggo-theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <link rel="stylesheet" href="styles/main.css?v=20261104-4" />
</head>
<body>
  <a href="#main-content" id="skip-link" class="skip-link">Langsung ke konten utama</a>

  <header id="site-header" class="site-header"></header>

  <main id="main-content" tabindex="-1"></main>

  <footer id="site-footer" class="site-footer"></footer>

  <div id="mobile-sticky-bar" class="mobile-sticky-bar"></div>

  <!-- Career Application Draft Modal (Swappable channels: Email / WhatsApp / Web Form) -->
  <div id="apply-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="apply-modal-title" aria-describedby="apply-modal-guide" onclick="if(event.target===this) closeApplyModal()">
    <div class="modal-dialog" style="max-width:540px;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px;">
        <h2 id="apply-modal-title" style="margin:0;">Buat Draf Lamaran Resmi</h2>
        <button type="button" id="apply-modal-close" class="btn btn-secondary" style="min-height:36px; padding:6px 10px;" onclick="closeApplyModal()" aria-label="Tutup">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <aside id="apply-modal-guide" class="callout" style="margin:0 0 16px; font-size:14px; padding:12px 14px;"></aside>
      <form onsubmit="submitCareerForm(event)">
        <div class="form-field">
          <label id="apply-role-label" for="apply-role-input">Posisi yang Dilamar</label>
          <input type="text" id="apply-role-input" required />
        </div>
        <div class="form-field">
          <label id="apply-name-label" for="apply-name-input">Nama Lengkap</label>
          <input type="text" id="apply-name-input" required />
        </div>
        <div class="form-field">
          <label id="apply-contact-label" for="apply-contact-input">Nomor Telepon / Email Aktif</label>
          <input type="text" id="apply-contact-input" required />
        </div>
        <div class="form-field">
          <label id="apply-msg-label" for="apply-msg-input">Ringkasan Pengalaman &amp; Motivasi Singkat</label>
          <textarea id="apply-msg-input" rows="4" required></textarea>
        </div>
        <!-- Task 4.3: Short privacy notice slot above the buttons, hidden when empty -->
        <p id="apply-privacy-notice" class="hint" hidden style="display:none; margin-bottom:12px; padding:10px 12px; background:var(--ui-surface-muted); border:1px solid var(--portal-line); border-radius:8px;"></p>
        <div id="apply-copy-feedback" class="hint" style="display:none; color:var(--ui-link); font-weight:700; margin-bottom:10px;"></div>
        <div style="display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px;">
          <button type="button" id="apply-cancel-btn" class="btn btn-secondary" onclick="closeApplyModal()">Batal</button>
          <button type="button" id="apply-copy-btn" class="btn btn-secondary" onclick="copyApplicationDraft()">Salin Teks &amp; Email</button>
          <button type="button" id="apply-whatsapp-btn" class="btn btn-secondary" hidden style="display:none;" onclick="applyViaChannel('whatsapp', event)">Lamar via WhatsApp ↗</button>
          <button type="button" id="apply-webform-btn" class="btn btn-primary" hidden style="display:none;" onclick="applyViaChannel('webform', event)">Kirim Formulir Web ↗</button>
          <button type="submit" id="apply-submit-btn" class="btn btn-primary">Buka Aplikasi Email ↗</button>
        </div>
      </form>
    </div>
  </div>

  <script src="site.config.js?v=20261104-4"></script>
  <script src="data/catalog-data.js?v=20261104-4"></script>
  <script src="data/site-data.js?v=20261104-4"></script>
  <script src="data/i18n.js?v=20261104-4"></script>
  <script src="scripts/app.js?v=20261104-4"></script>
</body>
</html>
